# Daily AI-citation check.
# Runs the tracker, commits the day's results to data/runs/, and that push
# makes Cloudflare rebuild the site so the Live proof page updates.
#
# Setup: repo Settings > Secrets and variables > Actions > New repository secret
#   PERPLEXITY_API_KEY  (and/or)  OPENAI_API_KEY
# Engines without a key are skipped.

name: Track AI citations

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC (07:17 in Belgrade, summer time)
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tracker
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/track.mjs

      - name: Commit results
        run: |
          git config user.name "geosynced-tracker"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/runs
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Tracker results $(date -u +%F)"
            git push
          fi
